name: virallab
services:
  ollama:
    image: ollama/ollama:0.40.14
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - models:/root/.ollama
    ports:
      - "127.0.0.1:${VIRALLAB_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  workbench:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    network_mode: service:ollama
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - workspace:/app/data
    restart: unless-stopped
volumes:
  models:
  workspace:
