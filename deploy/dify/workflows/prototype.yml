    - data:
        code: "import re\n\ndef main(raw: str) -> dict:\n    lines = raw.splitlines()\n\
          \    heading = next((i for i, line in enumerate(lines) if re.match(r'^\\\
          s*#{1,6}\\s*原文转录\\s*$', line)), None)\n    if heading is None:\n       \
          \ raise ValueError('原型文档中未找到“原文转录”标题，请补充该标题和口播正文。')\n    result = []\n \
          \   for line in lines[heading + 1:]:\n        if re.match(r'^\\s*#{1,6}\\\
          s+', line):\n            break\n        line = re.sub(r'^\\s*[-*+]\\s+',\
          \ '', line)\n        line = line.replace('**', '').replace('__', '')\n \
          \       line = re.sub(r'^\\s*[\\[（(]?\\s*(?:\\d{1,2}:)?\\d{1,2}:\\d{2}(?:[.,]\\\
          d+)?\\s*(?:[–—\\-~～至]\\s*(?:\\d{1,2}:)?\\d{1,2}:\\d{2}(?:[.,]\\d+)?)?\\\
          s*[\\]）)]?\\s*', '', line)\n        if line.strip() and not re.fullmatch(r'[-*_]{3,}',\
          \ line.strip()):\n            result.append(line.strip())\n    text = '\\\
          n'.join(result).strip()\n    if not text:\n        raise ValueError('“原文转录”部分没有可读取的口播正文。')\n\
          \    return {'text': text}\n"
